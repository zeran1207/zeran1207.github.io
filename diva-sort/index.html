<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>バトスピ ディーバ キャラソート</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <section id="start-screen" class="screen active">
            <div class="hero">
                <h1>バトスピ ディーバ キャラソート</h1>
                <p>好きなディーバを選んでランキングを作ろう！<br>200人近いので集計完了まで長いです<br>コードはChatGPTが書いてくれました、すごいね！<br>「この結果を集計に送る」ボタンでGoogleスプレッドシートに結果を送信できます（個人情報は保存しません）</p>
                <p>9人ずつ、好きな順番に選んでいこう！</p><button id="start-button" class="primary-button">スタート</button>
            </div>
        </section>
        <section id="group-screen" class="screen">
            <header>
                <h2 id="group-title"></h2>
                <p id="group-progress"></p>
            </header>
            <p class="hint">好きなキャラを1位から順番にタップしてください</p>
            <div id="group-cards" class="card-grid"></div>
            <div class="picked-area">
                <h3>現在の順位</h3>
                <ol id="picked-list" class="picked-list"></ol>
            </div>
        </section>
        <section id="merge-screen" class="screen">
            <header>
                <h2>総合順位を作成中</h2>
                <p id="merge-progress"></p>
            </header>
            <p class="hint">この中で一番好きなキャラをタップしてください</p>
            <div id="merge-cards" class="card-grid"></div>
        </section>
        <section id="result-screen" class="screen">
            <header>
                <h2>あなたのキャラソート結果</h2>
                <p id="result-count"></p>
            </header>
            <ol id="result-list" class="result-list"></ol>
            <div class="result-actions"><button id="vote-button" class="primary-button">この結果を集計に送る</button>
                <p id="vote-status"></p><button id="retry-button" class="secondary-button">もう一度遊ぶ</button>
            </div>
        </section>
    </main>
    <script src="characters.js"></script>
    <script src="script.js"></script>
</body>

</html>
