<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff7eb6">
  <title>バトスピ ディーバ キャラソート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>バトスピ ディーバ<br>キャラソート</h1>
      <p>好きな方をタップして、自分だけのランキングを作ろう！</p>
    </header>

    <section id="start-screen" class="panel">
      <h2>キャラソート</h2>
      <p>2人ずつ表示されるので、好きな方を選んでください。</p>
      <button id="start-button" class="primary">スタート</button>
    </section>

    <section id="game-screen" class="hidden">
      <div class="progress-wrap">
        <div id="progress-text">比較中…</div>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>

      <div class="choices">
        <button class="choice" id="choice-a">
          <img id="img-a" alt="">
          <span id="name-a"></span>
        </button>
        <div class="vs">VS</div>
        <button class="choice" id="choice-b">
          <img id="img-b" alt="">
          <span id="name-b"></span>
        </button>
      </div>
    </section>

    <section id="result-screen" class="panel hidden">
      <h2>あなたのランキング</h2>
      <ol id="result-list" class="result-list"></ol>
      <div class="actions">
        <button id="send-button" class="primary">この結果を集計に送る</button>
        <button id="stats-button" class="secondary">みんなの集計を見る</button>
        <button id="restart-button" class="secondary">もう一度遊ぶ</button>
      </div>
      <p id="send-status" class="status"></p>
    </section>

    <section id="stats-screen" class="panel hidden">
      <h2>みんなの集計</h2>
      <p id="vote-count"></p>
      <ol id="stats-list" class="result-list"></ol>
      <button id="back-button" class="secondary">ランキングに戻る</button>
    </section>

    <footer>
      <small>※投票の集計にはGoogle Apps Scriptの設定が必要です。</small>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
