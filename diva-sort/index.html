<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バトスピ 詩姫 キャラソート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section id="start-screen" class="screen active">
<h1>バトスピ 詩姫 キャラソート</h1>
<p>好きなディーバを選んでランキングを作ろう！<br>193人中の10位までが表示されます<br>コードはChatGPTが書いてくれました、すごいね！</p>
<button id="start-button" class="primary">スタート</button>
</section>

<section id="battle-screen" class="screen">
<div id="progress">比較</div>
<div class="choices">
<button id="choice-a" class="card"><img id="image-a"><span id="name-a"></span></button>
<div class="vs">VS</div>
<button id="choice-b" class="card"><img id="image-b"><span id="name-b"></span></button>
</div>
</section>

<section id="result-screen" class="screen">
<h1>結果発表！</h1>
<ol id="result-list"></ol>
<button id="retry-button" class="secondary">もう一度遊ぶ</button>
<!-- <button id="vote-button" class="primary">結果を集計に送る</button> -->
<p id="vote-status"></p>
</section>
</main>
<script src="characters.js"></script>
<script src="script.js"></script>
</body>
</html>
